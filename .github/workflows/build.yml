name: Build mod jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Inspect Apoli EntityAction API
        run: |
          JAR=$(find ~/.gradle -iname "apoli-*.jar" | grep -v sources | head -n 1)
          echo "Using jar: $JAR"
          mkdir -p /tmp/apoli-extract
          cd /tmp/apoli-extract
          unzip -o -q "$JAR" "io/github/apace100/apoli/action/*"
          find . -name "*.class" | while read f; do
            echo "===== $f ====="
            javap -p "$f" || true
          done
        continue-on-error: true

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
